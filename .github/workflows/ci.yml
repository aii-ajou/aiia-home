name: Validate website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIIA_CONTENT_SOURCE: fixtures
    strategy:
      fail-fast: false
      matrix:
        hosting: [root, pages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run test:content
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify root hosting
        if: matrix.hosting == 'root'
        run: npm run test:e2e
      - name: Verify GitHub Pages hosting
        if: matrix.hosting == 'pages'
        run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces-${{ matrix.hosting }}
          path: test-results/
          retention-days: 7
