name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AIIA_CONTENT_SOURCE: .content-repository
      AIIA_REQUIRE_CONTENT: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check content access
        env:
          CONTENT_READ_TOKEN: ${{ secrets.CONTENT_READ_TOKEN }}
        run: |
          if [ -z "$CONTENT_READ_TOKEN" ]; then
            echo '::error::CONTENT_READ_TOKEN이 필요합니다. docs/OPERATIONS.md의 최초 연결을 완료하세요.'
            exit 1
          fi
      - name: Read content repository settings
        id: content
        run: node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("content-source.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${c.repository}\nbranch=${c.branch}\n`);'
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.content.outputs.repository }}
          ref: ${{ steps.content.outputs.branch }}
          token: ${{ secrets.CONTENT_READ_TOKEN }}
          path: .content-repository
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 정적 산출물만 배포하므로 빌드 도구 취약점으로 콘텐츠 배포를 막지 않는다.
      # critical(악성 패키지 포함)만 차단하고 나머지는 경고로 남긴다. 0건 규칙은 ci.yml(PR)에서 강제.
      - name: Audit dependencies
        run: |
          npm audit || echo '::warning::npm audit 취약점이 있습니다. npm audit fix 후 PR로 반영하세요.'
          npm audit --audit-level=critical
      - run: npm run test:content
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - name: Record deployed revisions
        run: |
          echo "Code: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Content: $(git -C .content-repository rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: deployment-browser-traces
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
